# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
#
# J2 / J4 / J6 have firmware Joint Range Limits tighter than the URDF
# (Studio: -118~120 for J2, -11~225 for J4, -97~180 for J6). Their MoveIt
# position limits are clamped here with 1 deg of margin so OMPL sampling
# can never plan a trajectory that the firmware later rejects with C23
# (Joints Angle Exceed Limit). J1 / J3 / J5 / J7 are full +/-360 in firmware
# and are intentionally left to the URDF defaults so MoveIt can use the
# full rotation range.
joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 2.14
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint2:
    has_position_limits: true
    min_position: -2.0420   # -117 deg  (firmware -117.97)
    max_position:  2.0769   #  119 deg  (firmware  120.00)
    has_velocity_limits: true
    max_velocity: 2.14
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint3:
    has_velocity_limits: true
    max_velocity: 2.14
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint4:
    has_position_limits: true
    min_position: -0.1745   #  -10 deg  (firmware  -11)
    max_position:  3.9095   #  224 deg  (firmware  225)
    has_velocity_limits: true
    max_velocity: 2.14
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint5:
    has_velocity_limits: true
    max_velocity: 2.14
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint6:
    has_position_limits: true
    min_position: -1.6755   #  -96 deg  (firmware  -97)
    max_position:  3.1241   #  179 deg  (firmware  180)
    has_velocity_limits: true
    max_velocity: 2.14
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint7:
    has_velocity_limits: true
    max_velocity: 2.14
    has_acceleration_limits: true
    max_acceleration: 10.0
